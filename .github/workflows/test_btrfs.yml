name: Runner Btrfs

on:
  workflow_dispatch:
    inputs:
      chainWebRef:
         description: Reference (branch / tag / commit) to test
         default: evm/fix_fornumbers_spv_lookups

      sqliteSnapshot:
          description: Sqlite snapshot us use
          default: dbdump-2026-08-09
      
env:
  SQLITE_DOWNLOAD_URL: https://github.com/kda-community/pact-db-snapshot/releases/download/${{ github.event.inputs.sqliteSnapshot}}
  ROCKS_DB_DOWNLAD_URL: https://github.com/${{ github.repository }}/releases/download/first_release
  
jobs:
      
  btrfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast : false
      matrix:
        chain: ["1","2","3","4"]
        range:
          -
            - start: 6000000
              stop:  6250000
            - start: 6250000
              stop:  6500000
            - start: 6500000
              stop:  6750000
            - start: 6750000
              stop:  7100000
              
          -    
            - start: 5000000
              stop:  5250000
            - start: 5250000
              stop:  5500000
            - start: 5500000
              stop:  5750000
            - start: 5750000
              stop:  6000000

          -
            - start: 4000000
              stop:  4250000
            - start: 4250000
              stop:  4500000
            - start: 4500000
              stop:  4750000
            - start: 4750000
              stop:  5000000
              
          -
            - start: 3000000
              stop:  3250000
            - start: 3250000
              stop:  3500000
            - start: 3500000
              stop:  3750000
            - start: 3750000
              stop:  4000000
              
          -
            - start: 2000000
              stop:  2250000
            - start: 2250000
              stop:  2500000
            - start: 2500000
              stop:  2750000
            - start: 2750000
              stop:  3000000

          -
            - start: 1000000
              stop:  1250000
            - start: 1250000
              stop:  1500000
            - start: 1500000
              stop:  1750000
            - start: 1750000
              stop:  2000000

          -
            - start: 0
              stop:  250000
            - start: 250000
              stop:  500000
            - start: 500000
              stop:  750000
            - start: 750000
              stop:  1000000
              
    name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[0].start }} - ${{ matrix.range[3].stop }}

    steps:
      - name: Install Ubuntu Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs btrfs-compsize libgflags2.2 liblz4-1 libsnappy1v5 libmpfr6
    
      - name: Download Build artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: applications.yml
          ref: ${{ github.event.inputs.chainWebRef }}
          repo: kda-community/chainweb-node
          name: chainweb-applications.false.9.12.2.ubuntu-24.04
          workflow_conclusion: completed
          allow_forks: true

      - name: Extract Artifact archive
        run: |
          tar xzf *.tar.gz chainweb/pact-replay
          rm -rf *.tar.gz
      
      - name: Show binaries
        run: |
          ls -alh chainweb
    
      - name: Create Btrfs loop device
        run: |
          sudo truncate -s 80G /btrfs.img
          LOOP=$(sudo losetup --find --show /btrfs.img)

          sudo mkfs.btrfs -f "$LOOP"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o compress=zstd:3 "$LOOP" /mnt/btrfs

          df -h /mnt/btrfs
          sudo btrfs filesystem usage /mnt/btrfs

      - name: Create main Subvolme
        run: |
          sudo btrfs subvolume create /mnt/btrfs/main
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs/main
          mkdir -p  /mnt/btrfs/main/0
          mkdir -p  /mnt/btrfs/main/0/sqlite
          mkdir -p  /mnt/btrfs/main/0/rocksDb
          chattr -c /mnt/btrfs/main/0/sqlite

          sudp mkdir -p /mnt/btrfs/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs/tmp
          chattr +m /mnt/btrfs/tmp
      
      - parallel:
        - name: Download Pact DB Chain ${{ matrix.chain }}
          run: |
            cd /mnt/btrfs/main/0/sqlite
            i=0

            while curl  -sSLf "${SQLITE_DOWNLOAD_URL}/pact-v1-chain-${{ matrix.chain }}.sqlite.xz.part-$(printf "%02d" $i)"; do
              ((i+=1))
            done | xz -d >  pact-v1-chain-${{ matrix.chain }}.sqlite
  
            cd ..
            sudo compsize sqlite
            
        - name: Download RocksDb for Chain ${{ matrix.chain }}
          run: |
            set -Eeuo pipefail

            cd /mnt/btrfs/main/0/rocksDb
            tmp=$(mktemp /mnt/btrfs/tmp/tmp.XXXXXX)
            trap 'rm -f "$tmp"' EXIT
            i=0
            while true; do
              part=$(printf "%02d" "$i")
              url="${ROCKS_DB_DOWNLAD_URL}/rocksDb-chain-${{ matrix.chain }}.xz.part-${part}"

              echo "Downloading part ${part}..."
              if curl -fSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp" "$url"; then
                cat "$tmp"
                ((i+=1))
              else
                status=$(curl -sSL -o /dev/null -w '%{http_code}' "$url" || true)
                if [[ "$status" == "404" ]]; then
                  echo "All $i parts downloaded." >&2
                  break
                fi

                echo "Download failed: $url (HTTP $status)" >&2
                exit 1
              fi
            done | xz -dc | tar -xf -


# This step would be rmeoved once we have a migrated Sqlite snapshot
      - name: Migrate Database
        run : |
          set -o pipefail
          ./chainweb/pact-replay -v mainnet01 --database-directory /mnt/btrfs/main \
          --start 7000000 --end  7000000  \
          --chains '[${{ matrix.chain }}]' --log-level info | grep -v "Entry missing for blockHeight" | grep -v "discarded"
          

      - name: Cloning data
        run: |
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepA
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepB
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepC
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepD


      - parallel:
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[0].start }} - ${{ matrix.range[0].stop }}
          run: |
            set -o pipefail
            ./chainweb/pact-replay -v mainnet01 --database-directory /mnt/btrfs/stepA \
            --start ${{ matrix.range[0].start }} --end  ${{ matrix.range[0].stop }}  \
            --chains '[${{ matrix.chain }}]' --log-level info | tee log_${{ matrix.range[0].start }}_${{ matrix.range[0].stop }}.txt
            
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[1].start }} - ${{ matrix.range[1].stop }}
          run: |
            set -o pipefail
            ./chainweb/pact-replay -v mainnet01 --database-directory /mnt/btrfs/stepB \
            --start ${{ matrix.range[1].start }} --end  ${{ matrix.range[1].stop }}  \
            --chains '[${{ matrix.chain }}]' --log-level info | tee log_${{ matrix.range[1].start }}_${{ matrix.range[1].stop }}.txt

      
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[2].start }} - ${{ matrix.range[2].stop }}
          run: |
            set -o pipefail
            ./chainweb/pact-replay -v mainnet01 --database-directory /mnt/btrfs/stepC \
            --start ${{ matrix.range[2].start }} --end  ${{ matrix.range[2].stop }}  \
            --chains '[${{ matrix.chain }}]' --log-level info | tee log_${{ matrix.range[2].start }}_${{ matrix.range[2].stop }}.txt

      
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[3].start }} - ${{ matrix.range[3].stop }}
          run: |
            set -o pipefail
            ./chainweb/pact-replay -v mainnet01 --database-directory /mnt/btrfs/stepD \
            --start ${{ matrix.range[3].start }} --end  ${{ matrix.range[3].stop }}  \
            --chains '[${{ matrix.chain }}]' --log-level info | tee log_${{ matrix.range[3].start }}_${{ matrix.range[3].stop }}.txt

      
          
      - name: Compile logs
        run: |
          echo "Ended"
          
          
