name: Runner Btrfs

on:
  workflow_dispatch:

env:
  SQLITE_DOWNLOAD_URL: https://github.com/kda-community/pact-db-snapshot/releases/download/dbdump-2026-08-09

jobs:
      
  btrfs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chain: ["1","2","3"]
        range:
          -
            - start: 5000000
              stop: 5500000
            - start: 5500000
              stop: 6000000

          -
            - start: 4500000
              stop: 5000000
            - start: 4000000
              stop: 4500000
              
    name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[0].start }} - ${{ matrix.range[1].stop }}

    steps:
      - name: Download Build artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: applications.yml
          ref: evm/fix_fornumbers_spv_lookups
          repo: kda-community/chainweb-node
          name: chainweb-applications.false.9.12.2.ubuntu-24.04
          workflow_conclusion: completed
          allow_forks: true
      
      - name: Ls
        run: |
          ls -alh
    
      - name: Create Btrfs loop device
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs btrfs-compsize

          sudo truncate -s 80G /btrfs.img
          LOOP=$(sudo losetup --find --show /btrfs.img)

          sudo mkfs.btrfs -f "$LOOP"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o compress=zstd:3 "$LOOP" /mnt/btrfs

          df -h /mnt/btrfs
          sudo btrfs filesystem usage /mnt/btrfs

      - name: Create main Subvolme
        run: |
          sudo btrfs subvolume create /mnt/btrfs/main
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs/main

          mkdir -p  /mnt/btrfs/main/0
          mkdir -p  /mnt/btrfs/main/0/sqlite
          mkdir -p  /mnt/btrfs/main/0/rocksDb
          chattr -c /mnt/btrfs/main/0/sqlite

      - name: Download Pact DB Chain ${{ matrix.chain }}
        run: |
          cd /mnt/btrfs/main/0/sqlite
          i=0

          while curl -sSLf "${SQLITE_DOWNLOAD_URL}/pact-v1-chain-${{ matrix.chain }}.sqlite.xz.part-$(printf "%02d" $i)"; do
            ((i++))
          done | xz -d >  pact-v1-chain-${{ matrix.chain }}.sqlite
  
          cd ..
          sudo compsize sqlite

      - name: Cloning data
        run: |
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepA
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepB
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepC
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepD

      - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[0].start }} - ${{ matrix.range[0].stop }}
        run: |
          cd /mnt/btrfs/stepA
          ls -alh .
          ls -alh sqlite
          
          
