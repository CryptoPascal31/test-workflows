name: Chain replay

on:
  workflow_dispatch:
    inputs:
      chainWebRef:
         description: Reference (branch / tag / commit) to test
         default: evm/fix_fornumbers_spv_lookups

      sqliteSnapshot:
          description: Sqlite snapshot to use
          default: dbdump-2026-08-09

      rocksDbSnapshot:
          description: RockdDb snapshot to use
          default: first_release
  
      
env:
  SQLITE_DOWNLOAD_URL: https://github.com/kda-community/pact-db-snapshot/releases/download/${{ github.event.inputs.sqliteSnapshot}}
  ROCKS_DB_DOWNLAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.rocksDbSnapshot}}
  
jobs:
      
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast : false
      matrix:
        chain: ["1","2","3","4","5","6","7","8","9"]
        range:
          -
            - start: 6000000
              stop:  6250000
            - start: 6250000
              stop:  6500000
            - start: 6500000
              stop:  6750000
            - start: 6750000
              stop:  7100000
              
          -
            - start: 5000000
              stop:  5250000
            - start: 5250000
              stop:  5500000
            - start: 5500000
              stop:  5750000
            - start: 5750000
              stop:  6000000

          -
            - start: 4000000
              stop:  4250000
            - start: 4250000
              stop:  4500000
            - start: 4500000
              stop:  4750000
            - start: 4750000
              stop:  5000000

          -
            - start: 3500000
              stop:  3625000
            - start: 3625000
              stop:  3750000
            - start: 3750000
              stop:  3875000
            - start: 3875000
              stop:  4000000
              
          -
            - start: 3000000
              stop:  3125000
            - start: 3125000
              stop:  3250000
            - start: 3250000
              stop:  3375000
            - start: 3375000
              stop:  3500000
              
          -
            - start: 2000000
              stop:  2250000
            - start: 2250000
              stop:  2500000
            - start: 2500000
              stop:  2750000
            - start: 2750000
              stop:  3000000

          -
            - start: 1000000
              stop:  1250000
            - start: 1250000
              stop:  1500000
            - start: 1500000
              stop:  1750000
            - start: 1750000
              stop:  2000000

          -
            - start: 0
              stop:  250000
            - start: 250000
              stop:  500000
            - start: 500000
              stop:  750000
            - start: 750000
              stop:  1000000

              
    name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[0].start }} - ${{ matrix.range[3].stop }}

    steps:
      - name: Install Ubuntu Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs btrfs-compsize libgflags2.2 liblz4-1 libsnappy1v5 libmpfr6
    
      - name: Download Build artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: applications.yml
          ref: ${{ github.event.inputs.chainWebRef }}
          repo: kda-community/chainweb-node
          name: chainweb-applications.false.9.12.2.ubuntu-24.04
          workflow_conclusion: completed
          allow_forks: true

      - name: Extract Artifact archive
        run: |
          tar xzf *.tar.gz chainweb/pact-replay
          rm -rf *.tar.gz
      
      - name: Show binaries
        run: |
          ls -alh chainweb
    
      - name: Create Btrfs loop device
        run: |
          sudo truncate -s 80G /btrfs.img
          LOOP=$(sudo losetup --find --show /btrfs.img)

          sudo mkfs.btrfs -f "$LOOP"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o compress=zstd:3 "$LOOP" /mnt/btrfs

          df -h /mnt/btrfs
          sudo btrfs filesystem usage /mnt/btrfs

      - name: Create main Subvolme
        run: |
          sudo btrfs subvolume create /mnt/btrfs/main
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs/main
          mkdir -p  /mnt/btrfs/main/0
          mkdir -p  /mnt/btrfs/main/0/sqlite
          mkdir -p  /mnt/btrfs/main/0/rocksDb
          chattr +c /mnt/btrfs/main/0/sqlite

          sudo mkdir -p /mnt/btrfs/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs/tmp
          chattr +m /mnt/btrfs/tmp
      
      - parallel:
        - name: Download Pact DB Chain ${{ matrix.chain }}
          run: |
            set -Eeuo pipefail
          
            cd /mnt/btrfs/main/0/sqlite
            tmp=$(mktemp /mnt/btrfs/tmp/tmp.XXXXXX)
            trap 'rm -f "$tmp"' EXIT
            i=0
            while true; do
              part=$(printf "%02d" "$i")
              url="${SQLITE_DOWNLOAD_URL}/pact-v1-chain-${{ matrix.chain }}.sqlite.xz.part-${part}"

              echo "Downloading part ${part}..." >&2
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp" "$url"; then
                cat "$tmp"
                ((i+=1))
              else
                status=$(curl -sSL -o /dev/null -w '%{http_code}' "$url" || true)
                if [[ "$status" == "404" ]]; then
                  echo "All $i parts downloaded." >&2
                  break
                fi

                echo "Download failed: $url (HTTP $status)" >&2
                exit 1
              fi
            done | xz -d >  pact-v1-chain-${{ matrix.chain }}.sqlite
            
            cd ..
            sudo compsize sqlite
            
        - name: Download RocksDb for Chain ${{ matrix.chain }}
          run: |
            set -Eeuo pipefail

            cd /mnt/btrfs/main/0/rocksDb
            tmp=$(mktemp /mnt/btrfs/tmp/tmp.XXXXXX)
            trap 'rm -f "$tmp"' EXIT
            i=0
            while true; do
              part=$(printf "%02d" "$i")
              url="${ROCKS_DB_DOWNLAD_URL}/rocksDb-chain-${{ matrix.chain }}.xz.part-${part}"

              echo "Downloading part ${part}..." >&2
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp" "$url"; then
                cat "$tmp"
                ((i+=1))
              else
                status=$(curl -sSL -o /dev/null -w '%{http_code}' "$url" || true)
                if [[ "$status" == "404" ]]; then
                  echo "All $i parts downloaded." >&2
                  break
                fi

                echo "Download failed: $url (HTTP $status)" >&2
                exit 1
              fi
            done | xz -dc | tar -xf -


# This step would be rmeoved once we have a migrated Sqlite snapshot
      - name: Migrate Database
        run : |
          set -o pipefail
          ./chainweb/pact-replay -v mainnet01 --database-directory /mnt/btrfs/main \
          --start 7000000 --end  7000000  \
          --chains '[${{ matrix.chain }}]' --log-level info | grep -v "Entry missing for blockHeight" | grep -v "discarded"
          

      - name: Cloning data
        run: |
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepA
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepB
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepC
          sudo btrfs subvolume snapshot  /mnt/btrfs/main  /mnt/btrfs/stepD


      - parallel:
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[0].start }} - ${{ matrix.range[0].stop }}
          env:
            START: ${{ matrix.range[0].start }}
            STOP: ${{ matrix.range[0].stop }}
            CHAIN: ${{ matrix.chain }}
            DB_DIR: /mnt/btrfs/stepA
          run: |
            set -o pipefail            
            LOG_FILE=log_$CHAIN_$START_$STOP.txt
            ./chainweb/pact-replay -v mainnet01 --database-directory $DB_DIR --start $START --end $STOP --chains "[$CHAIN]" | tee $LOG_FILE

            
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[1].start }} - ${{ matrix.range[1].stop }}
          env:
            START: ${{ matrix.range[1].start }}
            STOP: ${{ matrix.range[1].stop }}
            CHAIN: ${{ matrix.chain }}
            DB_DIR: /mnt/btrfs/stepB          
          run: |
            set -o pipefail            
            LOG_FILE=log_$CHAIN_$START_$STOP.txt
            ./chainweb/pact-replay -v mainnet01 --database-directory $DB_DIR --start $START --end $STOP --chains "[$CHAIN]" | tee $LOG_FILE

      
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[2].start }} - ${{ matrix.range[2].stop }}
          env:
            START: ${{ matrix.range[2].start }}
            STOP: ${{ matrix.range[2].stop }}
            CHAIN: ${{ matrix.chain }}
            DB_DIR: /mnt/btrfs/stepC          
          run: |
            set -o pipefail            
            LOG_FILE=log_$CHAIN_$START_$STOP.txt
            ./chainweb/pact-replay -v mainnet01 --database-directory $DB_DIR --start $START --end $STOP --chains "[$CHAIN]" | tee $LOG_FILE

      
        - name: Replay Chain ${{ matrix.chain }} range ${{ matrix.range[3].start }} - ${{ matrix.range[3].stop }}
          env:
            START: ${{ matrix.range[3].start }}
            STOP: ${{ matrix.range[3].stop }}
            CHAIN: ${{ matrix.chain }}
            DB_DIR: /mnt/btrfs/stepD               
          run: |
            set -o pipefail            
            LOG_FILE=log_$CHAIN_$START_$STOP.txt
            ./chainweb/pact-replay -v mainnet01 --database-directory $DB_DIR --start $START --end $STOP --chains "[$CHAIN]" | tee $LOG_FILE

      - name: Compile logs
        if: always()
        run: |
          mkdir -p output_logs
          cp -f *.txt output_logs
                
      - name: Upload Logs to Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay_chain_${{ matrix.chain }}_${{ matrix.range[0].start }}_${{ matrix.range[3].stop }}
          path: output_logs


  compile_logs:
    runs-on: ubuntu-latest
    needs: replay
    if: always()

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Update Repos
        run: git pull
    
      - name: Prepare directory
        run: mkdir -p logs
    
      - name: Get workflow creation date
        id: date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq '.createdAt' | date -u -f - +%Y%m%d_%H%M%S)
          echo "value=$DATE" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with: 
          path: logs
          merge-multiple: true
      
      - name: Display structure of downloaded files
        run: ls -R

      - name: Upload Logs to Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay_logs
          path: logs

      - name: Push replay result to repository
        env:
          CHAIN_WEB_REF: ${{ github.event.inputs.chainWebRef }}
          SQLITE_SNAPSHOT: ${{ github.event.inputs.sqliteSnapshot }}
          ROCKSDB_SNAPSHOT: ${{ github.event.inputs.rocksDbSnapshot }}
          DATE: ${{ steps.date.outputs.value }}
        run: |
          set -Eeuo pipefail
          SAFE_REF=$(echo "$CHAIN_WEB_REF" | tr '/' '-')
          FILENAME="replay_result_${DATE}_${SAFE_REF}.tar.gz"
          INFOFILE="info_${DATE}_${SAFE_REF}.txt"

          mkdir -p results

          tar czf results/$FILENAME logs

          cat > "results/${INFOFILE}" <<EOF
          date: ${DATE}
          ref: ${CHAIN_WEB_REF}
          sqlite_snapshot: ${SQLITE_SNAPSHOT}
          rocksDb_snapshot: ${ROCKSDB_SNAPSHOT}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "results/${FILENAME}" "results/${INFOFILE}"

          git commit -m "Add replay result ${FILENAME}"
          git push
    
          
